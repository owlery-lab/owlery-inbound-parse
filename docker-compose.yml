services:
  api:
    build: .
    image: owlery-inbound-parse:local
    container_name: owlery-inbound-parse
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    # The database and attachments live in a Docker named volume, not a folder
    # shared from the host. SQLite needs working file locks, and folders shared
    # from macOS or Windows by Docker Desktop don't provide them reliably: a
    # second process touching the database can make the server's writes vanish.
    # A named volume lives inside Docker's own Linux filesystem, where locking
    # works.
    #
    # Only this container should ever open the database. Run CLI commands in it
    # with `docker compose exec -u bun api bun src/cli.ts ...`, never in a separate
    # container or from the host.
    volumes:
      - owlery-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  owlery-data:
